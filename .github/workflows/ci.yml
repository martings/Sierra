name: Sierra CI & OCI

on:
  push:
    branches: [master, main, feat/*]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  packages: write

jobs:
  r-package-tests:
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_18
    steps:
      - uses: actions/checkout@v4

      - name: Install R package dependencies and Sierra
        run: |
          Rscript -e '
            BiocManager::install(c(
              "GenomicRanges", "GenomicAlignments", "S4Vectors", "Rsamtools",
              "GenomeInfoDb", "GenomicFeatures", "BiocGenerics", "BiocParallel",
              "Biostrings", "IRanges", "SummarizedExperiment", "rtracklayer",
              "SingleCellExperiment", "DEXSeq", "genefilter", "Gviz", "BSgenome",
              "BiocStyle"
            ), update = FALSE, ask = FALSE)
            install.packages(c(
              "reshape2", "plyr", "dplyr", "foreach", "doParallel", "Matrix",
              "MLmetrics", "progress", "ggplot2", "cowplot", "flock", "magrittr",
              "R.utils", "data.table", "scales"
            ), repos = "https://cloud.r-project.org")
          '
          R CMD INSTALL --no-multiarch .

      - name: Run strandMode test suite
        run: Rscript tests/test_strandMode.R

      - name: Run R CMD check
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          R CMD build --no-build-vignettes .
          R CMD check --no-manual --no-build-vignettes --no-examples Sierra_*.tar.gz

  oci-image:
    needs: r-package-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sierra
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value={{sha}}

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
